# Zones (geofences, section 3.2 /zones). FICTITIOUS site centred on 4.1615 N, -75.1840 (Tolima,
# Colombia), chosen only so the polygons sit on real terrain in a map. The operation and all data
# are simulated and do not represent any real company. Bench elevations follow the SRTM terrain
# (~690 m). Polygon WKT order is "lon lat".

