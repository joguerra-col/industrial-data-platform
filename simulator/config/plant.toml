# Plant master data. Source: docs/phase-01-quarry/data-requirements.md, section 2.
# Asset IDs follow A-GL-TTT-NN (section 2.1).

[plant]
timezone = "America/Bogota"
hopper_id = "2-11-HOP-01"
crusher_id = "2-11-CRS-01"
belt_scale_id = "2-11-BWS-01"
analyzer_id = "2-11-ANZ-01"
stockpile_id = "2-91-STK-01"
waste_dump_id = "1-81-DMP-01"
hopper_live_capacity_t = 150
crusher_nominal_tph = 1000
crusher_to_scale_delay_s = 60
scale_to_analyzer_delay_s = 20

# Shift calendar (section 2.4). Times are local (timezone above). Weekdays: 0 = Monday.
[calendar]
operating_weekdays = [0, 1, 2, 3, 4, 5]
handover_min = 10
meal_break_min = 30

[[calendar.shifts]]
name = "A"
start = "08:00"
end = "16:00"
meal_window_start = "12:00"
meal_window_end = "14:00"

[[calendar.shifts]]
name = "B"
start = "16:00"
end = "24:00"
meal_window_start = "19:00"
meal_window_end = "21:00"

