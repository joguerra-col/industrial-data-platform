[project]
name = "raw-ingest"
version = "0.1.0"
description = "Idempotent ingestion of raw source files into PostgreSQL"
readme = "README.md"
authors = [
    { name = "jonatan guerra", email = "joguerra.col@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
raw-ingest = "raw_ingest.__main__:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
